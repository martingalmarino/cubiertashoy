name: Scrape

on:
  schedule:
    # 08:00 y 20:00 hora Argentina (UTC−3) → 11:00 y 23:00 UTC
    - cron: "0 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scrape-all
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape + health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Scrape all stores
        working-directory: scrapers
        run: python run.py --store all

      - name: Refresh size_daily_stats
        working-directory: scrapers
        run: python refresh_stats.py

      - name: Revalidate site
        if: ${{ env.SITE_URL != '' && env.REVALIDATE_SECRET != '' }}
        run: |
          set -euo pipefail
          SITE="${SITE_URL%/}"
          curl -fsS -X POST "${SITE}/api/revalidate" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Health checks
        working-directory: scrapers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python health.py
